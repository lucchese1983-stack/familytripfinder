<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1026">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Gite fuori porta, sagre, parchi ed eventi per famiglie con bambini in tutta Italia.">
    <meta name="apple-mobile-web-app-title" content="FamilyTrip">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/app-icon.png">
    <link rel="apple-touch-icon" href="/app-icon.png">
    <title>FamilyTrip Finder - Gite, Sagre & Eventi per Famiglie</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Fredoka', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        night: {
                            700: '#1c2550',
                            800: '#141b3d',
                            900: '#0b1026',
                            950: '#070a1a',
                        },
                        coral: { 300: '#ffa58c', 400: '#ff8a6b', 500: '#ff7a59', 600: '#f0603e' },
                        sun:   { 300: '#ffdb8a', 400: '#ffd06b', 500: '#ffc857' },
                        mint:  { 300: '#7ee0d6', 400: '#4fd1c5', 500: '#2ec4b6' },
                    },
                }
            }
        }
    </script>
    <!-- React (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/live-sources.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="preload" as="image" href="/images/families-hills.webp" fetchpriority="low">
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }
        html { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1026;
            color: #f1f5f9;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body.modal-open { overflow: hidden; }

        /* ===== Animated families background ===== */
        .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            background: linear-gradient(180deg, #070a1a 0%, #0b1026 35%, #1c2550 70%, #3a2a55 100%); }
        .scene-landscape {
            position: absolute; left: 0; right: 0; bottom: 0; height: 62vh;
            background-image: url('/images/families-hills.webp');
            background-repeat: no-repeat;
            background-size: auto 100%;
            background-position: 0% 100%;
            animation: pan 60s ease-in-out infinite alternate;
            opacity: .9;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%);
                    mask-image: linear-gradient(to bottom, transparent 0%, #000 30%);
        }
        @media (min-width: 1024px) {
            .scene-landscape { height: 75vh; background-size: cover; background-position: 50% 100%; animation: kenburns 40s ease-in-out infinite alternate; }
        }
        .scene-veil { position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(255,122,89,.25), transparent 60%),
                linear-gradient(180deg, rgba(11,16,38,.55) 0%, rgba(11,16,38,.35) 40%, rgba(11,16,38,.78) 100%); }
        @keyframes pan { from { background-position: 0% 100%; } to { background-position: 100% 100%; } }
        @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translateY(-1%); } }

        .star { position: absolute; width: 2px; height: 2px; border-radius: 9999px; background: #fff; animation: twinkle 3s ease-in-out infinite; }
        @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

        .cloud { position: absolute; height: 28px; border-radius: 9999px; background: rgba(255,255,255,.07); filter: blur(2px); animation: drift linear infinite; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 9999px; }
        .cloud::before { width: 50%; height: 200%; left: 15%; bottom: 20%; }
        .cloud::after  { width: 35%; height: 160%; left: 50%; bottom: 20%; }
        @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

        .balloon { position: absolute; bottom: -120px; animation: rise linear infinite; will-change: transform; }
        .balloon-body { width: 34px; height: 42px; border-radius: 50% 50% 46% 46%; position: relative; box-shadow: inset -6px -8px 0 rgba(0,0,0,.15); }
        .balloon-body::after { content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid var(--c); }
        .balloon-string { width: 1px; height: 46px; margin: 6px auto 0; background: rgba(255,255,255,.35); }
        @keyframes rise {
            0%   { transform: translate(0, 0) rotate(-3deg); opacity: 0; }
            8%   { opacity: .85; }
            50%  { transform: translate(24px, -60vh) rotate(3deg); }
            92%  { opacity: .85; }
            100% { transform: translate(-12px, -125vh) rotate(-3deg); opacity: 0; }
        }

        .kite { position: absolute; animation: kite 9s ease-in-out infinite; }
        @keyframes kite { 0%,100% { transform: translate(0,0) rotate(-8deg); } 50% { transform: translate(18px,-14px) rotate(8deg); } }

        @media (prefers-reduced-motion: reduce) {
            .scene-landscape, .star, .cloud, .balloon, .kite, .float-y { animation: none !important; }
            .balloon { display: none; }
        }

        /* ===== Surfaces ===== */
        .glass-panel {
            background: rgba(20, 27, 61, 0.62);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .glass-card {
            background: rgba(20, 27, 61, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
        }
        .glass-card:active { transform: scale(.98); }
        @media (hover: hover) {
            .glass-card:hover {
                background: rgba(28, 37, 80, 0.75);
                border-color: rgba(255, 122, 89, 0.45);
                transform: translateY(-4px);
                box-shadow: 0 16px 34px -14px rgba(255, 122, 89, 0.35);
            }
        }
        .glass-modal {
            background: rgba(11, 16, 38, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input {
            background: rgba(7, 10, 26, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 16px; /* prevents iOS zoom on focus */
        }
        @media (min-width: 768px) { .glass-input { font-size: 14px; } }
        .glass-input:focus {
            border-color: #ff7a59;
            box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.25);
            outline: none;
        }
        .glass-input option { background: #141b3d; color: #fff; }

        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .float-y { animation: floatY 6s ease-in-out infinite; }
        @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .fade-up { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .sheet-in { animation: sheetIn .35s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

        .pb-safe { padding-bottom: calc(var(--safe-bottom) + 0.5rem); }
        .pt-safe { padding-top: var(--safe-top); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b1026; }
        ::-webkit-scrollbar-thumb { background: #1c2550; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff7a59; }

        @media print {
            body * { visibility: hidden; }
            #printable-itinerary, #printable-itinerary * { visibility: visible; }
            #printable-itinerary { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; }
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 relative selection:bg-coral-500 selection:text-white">

    <!-- Animated family scene backdrop -->
    <div class="scene" aria-hidden="true">
        <div id="stars"></div>
        <div class="cloud" style="top:12%; width:140px; animation-duration:80s; animation-delay:-20s;"></div>
        <div class="cloud" style="top:24%; width:90px;  animation-duration:65s; animation-delay:-45s;"></div>
        <div class="cloud" style="top:6%;  width:110px; animation-duration:95s; animation-delay:-5s;"></div>

        <div class="balloon" style="left:8%;  animation-duration:26s; animation-delay:-4s;"><div class="balloon-body" style="--c:#ff7a59; background:#ff7a59;"></div><div class="balloon-string"></div></div>
        <div class="balloon" style="left:78%; animation-duration:32s; animation-delay:-14s; scale:.8"><div class="balloon-body" style="--c:#ffc857; background:#ffc857;"></div><div class="balloon-string"></div></div>
        <div class="balloon" style="left:45%; animation-duration:38s; animation-delay:-24s; scale:.7"><div class="balloon-body" style="--c:#2ec4b6; background:#2ec4b6;"></div><div class="balloon-string"></div></div>
        <div class="balloon" style="left:92%; animation-duration:29s; animation-delay:-8s; scale:.6"><div class="balloon-body" style="--c:#ff8a6b; background:#ff8a6b;"></div><div class="balloon-string"></div></div>

        <svg class="kite" style="top:18%; right:14%;" width="40" height="70" viewBox="0 0 40 70" fill="none">
            <path d="M20 0 L38 20 L20 44 L2 20 Z" fill="#ffc857"/>
            <path d="M20 0 L20 44 M2 20 L38 20" stroke="#ff7a59" stroke-width="1.5"/>
            <path d="M20 44 C 14 52, 26 58, 20 70" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
        </svg>

        <div class="scene-landscape"></div>
        <div class="scene-veil"></div>
    </div>
    <script>
        (function () {
            var c = document.getElementById('stars');
            var n = window.innerWidth < 768 ? 28 : 60;
            var html = '';
            for (var i = 0; i < n; i++) {
                html += '<span class="star" style="top:' + (Math.random() * 45).toFixed(1) + '%;left:' + (Math.random() * 100).toFixed(1) +
                    '%;animation-delay:' + (Math.random() * 3).toFixed(2) + 's"></span>';
            }
            c.innerHTML = html;
        })();
    </script>

    <div id="root" class="relative z-10"></div>

    <script src="/app.js"></script>
</body>
</html>
