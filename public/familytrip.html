        :root {

        /* ===== Animated families background ===== */
        .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            background: linear-gradient(180deg, #070a1a 0%, #0b1026 35%, #1c2550 70%, #3a2a55 100%); }
        .scene-landscape {
            position: absolute; left: 0; right: 0; bottom: 0; height: 62vh;
            background-image: url('/images/families-hills.png');
            background-repeat: no-repeat;
            background-size: auto 100%;
            background-position: 0% 100%;
            animation: pan 60s ease-in-out infinite alternate;
            opacity: .9;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%);
                    mask-image: linear-gradient(to bottom, transparent 0%, #000 30%);
        }
        @media (min-width: 1024px) {
            .scene-landscape { height: 75vh; background-size: cover; background-position: 50% 100%; animation: kenburns 40s ease-in-out infinite alternate; }
        }
        .scene-veil { position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(255,122,89,.25), transparent 60%),
                linear-gradient(180deg, rgba(11,16,38,.55) 0%, rgba(11,16,38,.35) 40%, rgba(11,16,38,.78) 100%); }
        @keyframes pan { from { background-position: 0% 100%; } to { background-position: 100% 100%; } }
        @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translateY(-1%); } }

        .star { position: absolute; width: 2px; height: 2px; border-radius: 9999px; background: #fff; animation: twinkle 3s ease-in-out infinite; }
        @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

        .cloud { position: absolute; height: 28px; border-radius: 9999px; background: rgba(255,255,255,.07); filter: blur(2px); animation: drift linear infinite; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 9999px; }
        .cloud::before { width: 50%; height: 200%; left: 15%; bottom: 20%; }
        .cloud::after  { width: 35%; height: 160%; left: 50%; bottom: 20%; }
        @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

        .balloon { position: absolute; bottom: -120px; animation: rise linear infinite; will-change: transform; }
        .balloon-body { width: 34px; height: 42px; border-radius: 50% 50% 46% 46%; position: relative; box-shadow: inset -6px -8px 0 rgba(0,0,0,.15); }
        .balloon-body::after { content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid var(--c); }
        .balloon-string { width: 1px; height: 46px; margin: 6px auto 0; background: rgba(255,255,255,.35); }
        @keyframes rise {
            0%   { transform: translate(0, 0) rotate(-3deg); opacity: 0; }
            8%   { opacity: .85; }
            50%  { transform: translate(24px, -60vh) rotate(3deg); }
            92%  { opacity: .85; }
            100% { transform: translate(-12px, -125vh) rotate(-3deg); opacity: 0; }
        }

        .kite { position: absolute; animation: kite 9s ease-in-out infinite; }
        @keyframes kite { 0%,100% { transform: translate(0,0) rotate(-8deg); } 50% { transform: translate(18px,-14px) rotate(8deg); } }

        @media (prefers-reduced-motion: reduce) {
            .scene-landscape, .star, .cloud, .balloon, .kite, .float-y { animation: none !important; }
            .balloon { display: none; }
        }

        /* ===== Surfaces ===== */
        .glass-panel {
            background: rgba(20, 27, 61, 0.62);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .glass-card {
            background: rgba(20, 27, 61, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
        }
        .glass-card:active { transform: scale(.98); }
        @media (hover: hover) {
            .glass-card:hover {
                background: rgba(28, 37, 80, 0.75);
                border-color: rgba(255, 122, 89, 0.45);
                transform: translateY(-4px);
                box-shadow: 0 16px 34px -14px rgba(255, 122, 89, 0.35);
            }
        }
        .glass-modal {
            background: rgba(11, 16, 38, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input {
            background: rgba(7, 10, 26, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 16px; /* prevents iOS zoom on focus */
        }
        @media (min-width: 768px) { .glass-input { font-size: 14px; } }
        .glass-input:focus {
            border-color: #ff7a59;
            box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.25);
            outline: none;
        }
        .glass-input option { background: #141b3d; color: #fff; }

        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .float-y { animation: floatY 6s ease-in-out infinite; }
        @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .fade-up { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .sheet-in { animation: sheetIn .35s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

        .pb-safe { padding-bottom: calc(var(--safe-bottom) + 0.5rem); }

        // Lucide icon rendered into a React-owned wrapper so it updates when props change
        function Icon({ name, className = "" }) {
            const ref = useRef(null);
            useEffect(() => {
                const el = ref.current;
                if (!el || !window.lucide) return;
                el.innerHTML = '<i data-lucide="' + name + '" class="' + className + '"></i>';
                window.lucide.createIcons({ root: el });
            }, [name, className]);
  return <span ref={ref} aria-hidden="true" className="inline-flex shrink-0 items-center justify-center leading-none" />;
  }

  function formatScanAge(scannedAt) {
  const minutes = Math.floor((Date.now() - new Date(scannedAt).getTime()) / 60000);
  if (minutes < 2) return "Aggiornato ora";
  if (minutes < 60) return `Aggiornato ${minutes} min fa`;
  return minutes < 1440 ? "Aggiornato oggi" : "Aggiornamento in corso alla prossima apertura";
  }

  function LiveStatusBadge({ isScanning, scannedAt, error }) {
  const [, tick] = useState(0);
  useEffect(() => {
  const id = setInterval(() => tick(n => n + 1), 30000);
  return () => clearInterval(id);
  }, []);

  if (isScanning) {
  return (
  <span role="status" className="inline-flex w-fit items-center gap-2 h-7 px-3 rounded-full bg-sun-500/15 border border-sun-500/30 text-sun-400 text-[11px] font-bold">
  <Icon name="loader-circle" className="w-3.5 h-3.5 animate-spin" />Cerco mete in zona...
  </span>
  );
  }
  if (scannedAt) {
  return (
  <span role="status" className="inline-flex w-fit items-center gap-2 h-7 px-3 rounded-full bg-coral-500/15 border border-coral-500/40 text-coral-300 text-[11px] font-bold">
  <span className="relative flex w-2 h-2">
  <span className="absolute inset-0 rounded-full bg-coral-500 animate-ping opacity-75"></span>
  <span className="relative w-2 h-2 rounded-full bg-coral-500"></span>
  </span>
  {formatScanAge(scannedAt)}
  </span>
  );
  }
  if (error) {
  return <span role="status" className="text-[11px] font-semibold text-coral-300">{error}</span>;
  }
  return null;
  }

        // Main App Component
        function App() {
            // State
            const SCAN_CACHE_STORAGE = 'familytrip_scan_cache';
            const readJSON = (k) => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
            const scanCacheRef = useRef(null);
            if (!scanCacheRef.current) scanCacheRef.current = new Map(Object.entries(readJSON(SCAN_CACHE_STORAGE)));
            const newestScans = () => [...scanCacheRef.current.values()]
                .filter(s => s && Array.isArray(s.places))
                .sort((a, b) => new Date(b.scannedAt) - new Date(a.scannedAt));
            const [liveData, setLiveData] = useState(() => {
                const loc = readJSON('familytrip_last_location');
                const sameZone = scanCacheRef.current.get(`${loc.region || 'Tutte'}|${loc.city || 'Tutte'}`);
                return sameZone || newestScans()[0] || { places: [], creators: [], zone: "", scannedAt: null };
            });
            const places = useMemo(() => {
                const seen = new Set();
                const recent = [liveData, ...newestScans()].flatMap(s => s.places || []);
                const unique = recent.filter(p => {
                    const k = `${p.title}|${p.city}`.toLowerCase();
                    if (seen.has(k)) return false;
                    seen.add(k);
                    return true;
                });
                const withImages = unique.map(p => p.image ? p : { ...p, image: INITIAL_PLACES.find(c => c.category === p.category)?.image || "/images/family-hero.png" });
                return [...withImages, ...INITIAL_PLACES];
            }, [liveData]);
            const [favorites, setFavorites] = useState(() => {
                const saved = localStorage.getItem('familytrip_favs');
                return saved ? JSON.parse(saved) : [];
            });
            
            // Search & Filters State
            const LOCATION_STORAGE = 'familytrip_last_location';
            const savedLocation = (() => {
                try { return JSON.parse(localStorage.getItem(LOCATION_STORAGE)) || {}; } catch { return {}; }
            })();
            const [selectedRegion, setSelectedRegion] = useState(() => REGIONS_DATA[savedLocation.region] ? savedLocation.region : "Tutte");
            const [selectedCity, setSelectedCity] = useState(() => REGIONS_DATA[savedLocation.region]?.includes(savedLocation.city) ? savedLocation.city : "Tutte");
            const gpsRef = useRef(savedLocation.lat != null ? savedLocation : null);
            const [locationReady, setLocationReady] = useState(false);
            const [searchTerm, setSearchTerm] = useState("");
            const [activeTab, setActiveTab] = useState("Tutti");
            const [seasonFilter, setSeasonFilter] = useState("Tutte");
            const [ageFilter, setAgeFilter] = useState("Tutte");
            
            // Accessibility Toggles
            const [strollerOnly, setStrollerOnly] = useState(false);
            const [picnicOnly, setPicnicOnly] = useState(false);
            const [dogsOnly, setDogsOnly] = useState(false);

            // Modals
            const [activeDetailModal, setActiveDetailModal] = useState(null);
            const [showSettingsModal, setShowSettingsModal] = useState(false);

            const [isAiSearching, setIsAiSearching] = useState(false);
            const [scanError, setScanError] = useState("");
            const saveScan = (key, data) => {
                const cache = scanCacheRef.current;
                cache.set(key, data);
                const newest = [...cache.entries()]
                    .sort((a, b) => new Date(b[1].scannedAt) - new Date(a[1].scannedAt))
                    .slice(0, 12);
                scanCacheRef.current = new Map(newest);

            };

            const showToast = (msg) => {
                setToastMessage(msg);

            };

            // Toggle Favorites
            const toggleFavorite = (id, e) => {
                if (e) e.stopPropagation();
                setFavorites(prev => {
                    const isFav = prev.includes(id);

                    showToast(isFav ? "Rimosso dai preferiti" : "Aggiunto ai preferiti!");

            // GPS Geolocation Handler
            const handleGPSLocation = ({ silent = false } = {}) => {
                const finish = () => { setGpsLoading(false); setLocationReady(true); };
                if (!navigator.geolocation) {
                    if (!silent) showToast("Geolocalizzazione non supportata dal tuo browser.");

                setGpsLoading(true);
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            const { latitude, longitude } = position.coords;
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=it&lat=${latitude}&lon=${longitude}`, { signal: AbortSignal.timeout(6000) });
                            const data = await res.json();
                            const address = data.address || {};
                            const detectedState = (address.state || address.region || "").toLowerCase();
                            const detectedCity = address.city || address.town || address.village || address.municipality || "";

                            const matchedRegion = Object.keys(REGIONS_DATA).find(reg => reg !== "Tutte" && detectedState.includes(reg.toLowerCase())) || "Tutte";
                            const matchedCity = (REGIONS_DATA[matchedRegion] || []).find(c => c !== "Tutte" && c.toLowerCase() === detectedCity.toLowerCase()) || "Tutte";

                            gpsRef.current = { lat: latitude, lon: longitude, region: matchedRegion, city: matchedCity, name: detectedCity };
                            setSelectedRegion(matchedRegion);
                            setSelectedCity(matchedCity);
                            localStorage.setItem(LOCATION_STORAGE, JSON.stringify({ region: matchedRegion, city: matchedCity, lat: latitude, lon: longitude, name: detectedCity }));
                            showToast(`Posizione rilevata: ${detectedCity || matchedRegion || 'Italia'}`);
                        } catch (err) {
                            if (!silent) showToast("Errore nel rilevare la posizione.");
                        } finally {
                            finish();
                        }
                    },
                    () => {
                        finish();
                        if (!silent) showToast("Attiva la posizione nelle impostazioni del browser.");
                    },
                    { enableHighAccuracy: false, timeout: 8000, maximumAge: 30 * 60 * 1000 }
                );
            };

            useEffect(() => {
                handleGPSLocation({ silent: true });

            const SCAN_FRESH_MS = 10 * 60 * 1000;

                const region = selectedRegion === "Tutte" ? "" : selectedRegion;

                const gpsMatches = gps && (!region || gps.region === region) && (!city || gps.city === city);
                if (gpsMatches && (city || !region || gps.region === region)) {
                    return { center: { lat: gps.lat, lon: gps.lon }, radiusKm: 20, zone: city || gps.name || region || "la tua zona" };
                }
                if (city) {
                    const center = await window.FamilyLive.geocode(`${city}, ${region}, Italia`, signal);
                    return center && { center, radiusKm: 20, zone: city };
                }
                if (region) {
                    const center = await window.FamilyLive.geocode(`${region}, Italia`, signal);
                    return center && { center, radiusKm: 40, zone: region };
                }
                return null;
            };

                const key = `${selectedRegion}|${selectedCity}`;
                const cached = scanCacheRef.current.get(key);
                if (cached) setLiveData(cached);
                if (!force && cached && Date.now() - new Date(cached.scannedAt).getTime() < SCAN_FRESH_MS) {
                    setScanError("");
                    return;
                }
                if (!window.FamilyLive || scanInFlightKeyRef.current === key) return;

                scanAbortRef.current?.abort();
                const controller = new AbortController();
                scanAbortRef.current = controller;
                scanInFlightKeyRef.current = key;
                setIsAiSearching(true);
                setScanError("");

                try {
                    const target = await resolveZone(controller.signal);
                    if (!target) {
                        if (force) showToast("Scegli una Regione o attiva la posizione per cercare intorno a te.");
                        return;
                    }
                    const data = await window.FamilyLive.scanZone({
                        ...target,
                        region: selectedRegion === "Tutte" ? (gpsRef.current?.region || "Tutte") : selectedRegion,
                        city: selectedCity === "Tutte" ? "" : selectedCity,
                        signal: controller.signal,

                        setScanError(cached ? "" : "Nessuna nuova meta trovata in zona: ecco il catalogo.");
                        if (force) showToast("Nessuna nuova meta trovata, riprova tra poco.");
                        return;

                    saveScan(key, data);
                    setLiveData(data);
                    if (force) showToast(`${data.places.length} mete aggiornate per ${data.zone}`);

                    if (controller.signal.aborted) return;

                    setScanError(message);

                    }

                    // Accessibility

                    // Search Keyword

                        const matchTitle = place.title.toLowerCase().includes(term);
                        const matchDesc = place.description.toLowerCase().includes(term);
                        const matchCity = place.city.toLowerCase().includes(term);
                        if (!matchTitle && !matchDesc && !matchCity) return false;

                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 my-5">
                                        <div className="rounded-2xl p-4 bg-mint-500/10 border border-mint-500/20">
                                            <h3 className="font-bold text-mint-300 mb-1.5 flex items-center gap-2">
                                                <Icon name="search" className="w-4 h-4" />
                                                Ricerca & GPS
                                            </h3>
                                            <p className="text-xs text-slate-300">
                                                Filtra per regione, città o usa la tua posizione. Aggiungi i filtri per passeggino, cani o area picnic.
                                            </p>
                                        </div>
                                        <div className="rounded-2xl p-4 bg-coral-500/10 border border-coral-500/20">
                                            <h3 className="font-bold text-coral-300 mb-1.5 flex items-center gap-2">
                                                <Icon name="sparkles" className="w-4 h-4" />
                                                Pianifica giornata
                                            </h3>
                                            <p className="text-xs text-slate-300">
                                                Apri una meta e tocca &quot;Pianifica giornata&quot; per un programma completo dalla mattina alla sera.
                                            </p>
                                        </div>
                                    </div>
                                    <p className="text-xs text-slate-400">
                                        Le mete vicine si aggiornano da sole a ogni apertura, gratis e senza registrazione, grazie a OpenStreetMap e Wikipedia.
                                    </p>
                                    <button onClick={() => goTo("Tutti")} className="mt-2 h-11 px-5 rounded-2xl bg-white text-night-950 font-bold text-sm inline-flex items-center gap-2">
                                        <Icon name="compass" className="w-4 h-4 text-coral-500" />
                                        Inizia a esplorare
                                    </button>
                                </div>
                            </section>
                        )}

                        {/* CARDS GRID */}
                        {activeTab !== "Info & Guida" && (
                            <>
                                {filteredPlaces.length === 0 ? (
                                    <div className="glass-panel p-8 sm:p-12 text-center rounded-3xl my-6 fade-up">
                                        <div className="mx-auto mb-4 grid place-items-center w-16 h-16 rounded-full bg-coral-500/15 text-coral-400">
                                            <Icon name={activeTab === "I Miei Preferiti" ? "heart" : "map-pin-off"} className="w-8 h-8" />
                                        </div>
                                        <h3 className="font-display text-xl font-semibold text-white mb-1">
                                            {activeTab === "I Miei Preferiti" ? "Ancora nessun preferito" : "Nessuna meta trovata"}
                                        </h3>
                                        <p className="text-sm text-slate-400 mb-5 max-w-sm mx-auto">
                                            {activeTab === "I Miei Preferiti" ? "Tocca il cuore su una gita per salvarla qui." : "Prova a modificare i filtri o cerca nuovi eventi online."}
                                        </p>
                                        <div className="flex flex-col sm:flex-row gap-2 justify-center">
                                            {activeFilterCount > 0 && (
                                                <button onClick={resetFilters} className="h-11 px-5 rounded-2xl bg-white/10 text-white font-semibold text-sm">Azzera filtri</button>
                                            )}
                                            <button onClick={activeTab === "I Miei Preferiti" ? () => goTo("Tutti") : handleSearchWebWithGemini} className="h-11 px-5 rounded-2xl bg-coral-500 text-white font-bold text-sm hover:bg-coral-600">
                                                {activeTab === "I Miei Preferiti" ? "Esplora le mete" : "Cerca mete vicine"}
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-12">
                                        {filteredPlaces.map((place, i) => {
                                            const isFav = favorites.includes(place.id);
                                            return (
                                                <article
                                                    key={place.id}
                                                    onClick={() => setActiveDetailModal(place)}
                                                    onKeyDown={(e) => { if (e.key === 'Enter') setActiveDetailModal(place); }}
                                                    tabIndex={0}
                                                    style={{ animationDelay: `${Math.min(i, 8) * 50}ms` }}
                                                    className="fade-up glass-card rounded-3xl overflow-hidden flex flex-col group cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-coral-500"
                                                >
                                                    <div className="relative h-44 sm:h-48 w-full overflow-hidden">
                                                        <img
                                                            src={place.image}
                                                            alt={place.title}
                                                            loading="lazy"
                                                            decoding="async"
                                                            className="w-full h-full object-cover transition duration-700 group-hover:scale-105"
                                                            onError={(e) => {
                                                                e.target.onerror = null;
                                                                e.target.src = "/images/family-hero.png";
                                                            }}
                                                        />
                                                        <div className="absolute inset-0 bg-gradient-to-t from-night-950/90 via-night-950/10 to-transparent"></div>

                                                        <button
                                                            onClick={(e) => toggleFavorite(place.id, e)}
                                                            aria-label={isFav ? "Rimuovi dai preferiti" : "Aggiungi ai preferiti"}
                                                            aria-pressed={isFav}
                                                            className={`absolute top-3 right-3 z-10 grid place-items-center w-10 h-10 rounded-full backdrop-blur-md border transition active:scale-90 ${isFav ? 'bg-coral-500 border-coral-500 text-white' : 'bg-night-950/50 border-white/20 text-white'}`}
                                                        >
                                                            <Icon name="heart" className={`w-5 h-5 ${isFav ? 'fill-current' : ''}`} />
                                                        </button>

                                                        <span className="absolute top-3 left-3 bg-night-950/70 backdrop-blur-md border border-white/10 text-sun-300 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider max-w-[65%] truncate">
                                                            {place.category}
                                                        </span>

                                                        <div className="absolute bottom-3 left-3 right-3 flex items-center justify-between gap-2">
                                                            <span className="inline-flex items-center gap-1 text-xs text-white font-semibold min-w-0">
                                                                <Icon name="map-pin" className="w-3.5 h-3.5 text-coral-400" />
                                                                <span className="truncate">{place.city}, {place.region}</span>
                                                            </span>
                                                            <span className="shrink-0 inline-flex items-center gap-1 text-xs font-bold text-night-950 bg-sun-400 px-2 py-0.5 rounded-full">
                                                                <Icon name="star" className="w-3 h-3 fill-current" />
                                                                {place.rating}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    <div className="p-4 sm:p-5 flex-1 flex flex-col">
                                                        <h3 className="font-display text-lg font-semibold text-white leading-snug line-clamp-2 group-hover:text-coral-300 transition">
                                                            {place.title}
                                                        </h3>
                                                        <p className="mt-1.5 text-[13px] text-slate-400 line-clamp-2 leading-relaxed">
                                                            {place.description}
                                                        </p>

                                                        <div className="mt-auto pt-4 flex items-center justify-between gap-2">
                                                            <div className="flex flex-wrap items-center gap-1.5 text-[11px]">
                                                                <span className="px-2 py-0.5 rounded-full bg-mint-500/15 text-mint-300 font-semibold">{place.minAge}</span>
                                                                <span className="px-2 py-0.5 rounded-full bg-sun-500/15 text-sun-300 font-semibold">{place.season}</span>
                                                            </div>
                                                            <div className="flex items-center gap-2 text-slate-300">
                                                                {place.stroller && <span title="Passeggino OK"><Icon name="baby" className="w-4 h-4 text-mint-400" /></span>}
                                                                {place.picnic && <span title="Area picnic"><Icon name="sandwich" className="w-4 h-4 text-sun-400" /></span>}
                                                                {place.dogs && <span title="Cani ammessi"><Icon name="dog" className="w-4 h-4 text-coral-400" /></span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </article>
                                            );
                                        })}
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    {/* 6. DETAIL SHEET */}
                    {activeDetailModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-night-950/80 backdrop-blur-sm"
                            onClick={closeDetail}
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="detail-title"
                        >
                            <div
                                className="sheet-in glass-modal w-full sm:max-w-2xl rounded-t-[2rem] sm:rounded-3xl overflow-hidden shadow-2xl relative max-h-[92dvh] flex flex-col"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="overflow-y-auto overscroll-contain">
                                    <div className="relative h-56 sm:h-64 w-full">
                                        <img src={activeDetailModal.image} alt={activeDetailModal.title} className="w-full h-full object-cover"
                                            onError={(e) => { e.target.onerror = null; e.target.src = "/images/family-hero.png"; }} />
                                        <div className="absolute inset-0 bg-gradient-to-t from-night-900 via-night-900/30 to-transparent"></div>
                                        <span className="sm:hidden absolute top-2 left-1/2 -translate-x-1/2 w-10 h-1.5 rounded-full bg-white/60" aria-hidden="true"></span>
                                        <button
                                            onClick={closeDetail}
                                            className="absolute top-4 right-4 z-20 grid place-items-center w-10 h-10 rounded-full bg-night-950/60 backdrop-blur border border-white/20 text-white"
                                            aria-label="Chiudi"
                                        >
                                            <Icon name="x" className="w-5 h-5" />
                                        </button>
                                        <button
                                            onClick={(e) => toggleFavorite(activeDetailModal.id, e)}
                                            className={`absolute top-4 right-16 z-20 grid place-items-center w-10 h-10 rounded-full backdrop-blur border ${favorites.includes(activeDetailModal.id) ? 'bg-coral-500 border-coral-500' : 'bg-night-950/60 border-white/20'} text-white`}
                                            aria-label="Preferito"
                                            aria-pressed={favorites.includes(activeDetailModal.id)}
                                        >
                                            <Icon name="heart" className={`w-5 h-5 ${favorites.includes(activeDetailModal.id) ? 'fill-current' : ''}`} />
                                        </button>
                                        <div className="absolute bottom-4 left-5 right-5">
                                            <span className="bg-sun-500 text-night-950 font-bold text-[10px] uppercase px-2.5 py-0.5 rounded-full mb-2 inline-block">
                                                {activeDetailModal.category}
                                            </span>
                                            <h2 id="detail-title" className="font-display text-2xl sm:text-3xl font-semibold text-white leading-tight text-balance">{activeDetailModal.title}</h2>
                                            <p className="mt-1 text-xs text-slate-300 flex items-center gap-1">
                                                <Icon name="map-pin" className="w-3.5 h-3.5 text-coral-400" />
                                                {activeDetailModal.address}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="p-5 sm:p-6 space-y-5">
                                        <div className="grid grid-cols-3 gap-2">
                                            {[
                                                ["Passeggino", activeDetailModal.stroller, "baby"],
                                                ["Picnic", activeDetailModal.picnic, "sandwich"],
                                                ["Cani", activeDetailModal.dogs, "dog"],
                                            ].map(([label, ok, ic]) => (
                                                <div key={label} className={`rounded-2xl p-3 text-center border ${ok ? 'bg-mint-500/10 border-mint-500/25 text-mint-300' : 'bg-white/5 border-white/10 text-slate-500'}`}>
                                                    <Icon name={ic} className="w-5 h-5 mx-auto mb-1" />
                                                    <span className="block text-[11px] font-semibold">{label} {ok ? 'sì' : 'no'}</span>
                                                </div>
                                            ))}
                                        </div>

                                        <div>
                                            <h3 className="text-[11px] font-bold text-coral-300 uppercase tracking-wider mb-1.5">Descrizione</h3>
                                            <p className="text-sm text-slate-200 leading-relaxed">{activeDetailModal.description}</p>
                                        </div>

                                        <div className="p-4 rounded-2xl bg-sun-500/10 border border-sun-500/25 flex items-start gap-3">
                                            <span className="text-sun-400 mt-0.5"><Icon name="lightbulb" className="w-5 h-5" /></span>
                                            <div>
                                                <h4 className="text-xs font-bold text-sun-300 mb-0.5">Consiglio di mamma & papà</h4>
                                                <p className="text-sm text-slate-200">{activeDetailModal.parentTip}</p>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-2">
                                            {activeDetailModal.socialInsta && (
                                                <a href={activeDetailModal.socialInsta} target="_blank" rel="noopener noreferrer" className="h-10 px-4 rounded-full bg-white/5 border border-white/10 text-slate-200 text-xs font-semibold inline-flex items-center gap-2 hover:bg-white/10">
                                                    <Icon name="camera" className="w-4 h-4 text-coral-400" />Instagram
                                                </a>
                                            )}
                                            {activeDetailModal.socialFb && (
                                                <a href={activeDetailModal.socialFb} target="_blank" rel="noopener noreferrer" className="h-10 px-4 rounded-full bg-white/5 border border-white/10 text-slate-200 text-xs font-semibold inline-flex items-center gap-2 hover:bg-white/10">
                                                    <Icon name="users" className="w-4 h-4 text-mint-400" />Facebook
                                                </a>
                                            )}
                                            {activeDetailModal.sourceUrl && (
                                                <a href={activeDetailModal.sourceUrl} target="_blank" rel="noopener noreferrer" className="h-10 px-4 rounded-full bg-coral-500/15 border border-coral-500/40 text-coral-300 text-xs font-semibold inline-flex items-center gap-2 hover:bg-coral-500/25">
                                                    <Icon name="globe" className="w-4 h-4" />Fonte web
                                                </a>
                                            )}
                                        </div>

                                        {/* AI Itinerary */}
                                        <div className="pt-4 border-t border-white/10">
                                            <h3 className="text-sm font-bold text-white flex items-center gap-2 mb-3">
                                                <Icon name="bot" className="w-4 h-4 text-mint-400" />
                                                Itinerario della giornata
                                            </h3>
                                            {isGeneratingItinerary && (
                                                <div className="space-y-2" aria-label="Generazione in corso">
                                                    <div className="h-3 rounded bg-white/10 animate-pulse w-11/12"></div>
                                                    <div className="h-3 rounded bg-white/10 animate-pulse w-9/12"></div>
                                                    <div className="h-3 rounded bg-white/10 animate-pulse w-10/12"></div>
                                                </div>
                                            )}
                                            {aiItinerary && (
                                                <div id="printable-itinerary" className="rounded-2xl p-4 bg-white/5 border border-mint-500/25 text-sm text-slate-200 leading-relaxed">
                                                    <div className="font-bold text-mint-300 mb-3 pb-2 border-b border-white/10">
                                                        Programma per: {activeDetailModal.title}
                                                    </div>
                                                    <div className="flex flex-col gap-4">
                                                        {aiItinerary.sections.map(section => (
                                                            <section key={section.title} className="flex flex-col gap-2">
                                                                <h4 className="text-[11px] font-bold uppercase tracking-wider text-sun-300">{section.title}</h4>
                                                                <ul className="flex flex-col gap-2">
                                                                    {section.items.map((item, idx) => (
                                                                        <li key={idx} className="flex gap-3">
                                                                            {item.time
                                                                                ? <span className="shrink-0 w-12 font-mono text-xs font-bold text-mint-300 pt-0.5">{item.time}</span>
                                                                                : <span className="shrink-0 w-1.5 h-1.5 mt-2 rounded-full bg-mint-400" aria-hidden="true"></span>}
                                                                            <span className="text-pretty">
                                                                                {item.text}
                                                                                {item.link && (
                                                                                    <> <a href={item.link.url} target="_blank" rel="noopener noreferrer" className="text-coral-300 underline font-semibold">{item.link.label}</a></>
                                                                                )}
                                                                            </span>
                                                                        </li>
                                                                    ))}
                                                                </ul>
                                                            </section>
                                                        ))}
                                                    </div>
                                                    <div className="mt-4 pt-3 border-t border-white/10 flex justify-end">
                                                        <button onClick={() => window.print()} className="h-10 px-4 rounded-full bg-white/10 text-mint-300 hover:bg-white/15 font-bold inline-flex items-center gap-2 text-xs">
                                                            <Icon name="printer" className="w-4 h-4" />
                                                            Scarica / Stampa PDF
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                            {!aiItinerary && !isGeneratingItinerary && (
                                                <p className="text-xs text-slate-400">Crea un programma da mattina a sera con orari, pranzo, tappe vicine e cosa mettere nello zaino.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Sticky actions, thumb-friendly */}
                                <div className="shrink-0 grid grid-cols-2 gap-2 p-3 sm:p-4 border-t border-white/10 bg-night-900/95 pb-safe">
                                    <a
                                        href={mapsUrl(activeDetailModal)}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="h-12 rounded-2xl bg-white/10 text-white font-semibold text-sm inline-flex items-center justify-center gap-2 hover:bg-white/15"
                                    >
                                        <Icon name="navigation" className="w-4 h-4 text-mint-400" />
                                        Portami lì
                                    </a>
                                    <button
                                        onClick={() => generateAIItinerary(activeDetailModal)}
                                        disabled={isGeneratingItinerary}
                                        className="h-12 rounded-2xl bg-gradient-to-r from-coral-500 to-sun-500 text-night-950 font-bold text-sm inline-flex items-center justify-center gap-2 disabled:opacity-70 active:scale-[.98] transition"
                                    >
                                        <Icon name="sparkles" className={`w-4 h-4 ${isGeneratingItinerary ? 'animate-spin' : ''}`} />
                                        {isGeneratingItinerary ? 'Genero...' : 'Pianifica giornata'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 7. GEMINI SETTINGS SHEET */}
                    {showSettingsModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-night-950/80 backdrop-blur-sm"
                            onClick={() => setShowSettingsModal(false)}
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="settings-title"
                        >
                            <div className="sheet-in glass-modal w-full sm:max-w-md rounded-t-[2rem] sm:rounded-3xl p-5 sm:p-6 shadow-2xl relative pb-safe" onClick={(e) => e.stopPropagation()}>
                                <span className="sm:hidden block mx-auto mb-4 w-10 h-1.5 rounded-full bg-white/30" aria-hidden="true"></span>
                                <button
                                    onClick={() => setShowSettingsModal(false)}
                                    className="absolute top-4 right-4 grid place-items-center w-10 h-10 rounded-full bg-white/5 border border-white/10 text-slate-300 hover:text-white"
                                    aria-label="Chiudi"
                                >
                                    <Icon name="x" className="w-5 h-5" />
                                </button>

                                <div className="flex items-center gap-3 mb-5">
                                    <span className="grid place-items-center w-12 h-12 rounded-2xl bg-mint-500/15 border border-mint-500/30 text-mint-400">
                                        <Icon name="radio" className="w-6 h-6" />
                                    </span>
                                    <div>
                                        <h3 id="settings-title" className="font-display text-xl font-semibold text-white">Ricerca Live gratuita</h3>
                                        <p className="text-xs text-slate-400">Nessuna chiave o registrazione richiesta</p>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-4 text-sm">
                                    <LiveStatusBadge isScanning={isAiSearching} scannedAt={liveData.scannedAt} error={scanError} />
                                    <ul className="flex flex-col gap-2 text-xs text-slate-300 leading-relaxed">
                                        <li className="flex gap-2"><Icon name="refresh-cw" className="w-4 h-4 shrink-0 text-mint-400" />Si aggiorna da solo a ogni apertura e quando cambi Regione o Città.</li>
                                        <li className="flex gap-2"><Icon name="map" className="w-4 h-4 shrink-0 text-mint-400" />Cerca parchi, zoo, acquari, musei e castelli vicini su OpenStreetMap e Wikipedia.</li>
                                        <li className="flex gap-2"><Icon name="file-text" className="w-4 h-4 shrink-0 text-mint-400" />&quot;Pianifica giornata&quot; crea il programma con orari, tappe vicine ed esportazione PDF.</li>
                                    </ul>
                                    {liveData.creators.length > 0 && <CreatorStrip creators={liveData.creators} zone={liveData.zone} />}
                                    <button
                                        onClick={() => { setShowSettingsModal(false); handleSearchWebWithGemini(); }}
                                        disabled={isAiSearching}
                                        className="h-12 rounded-2xl bg-coral-500 text-white font-bold hover:bg-coral-600 inline-flex items-center justify-center gap-2 disabled:opacity-60"
                                    >
                                        <Icon name="zap" className="w-4 h-4" />
                                        Aggiorna adesso
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="mt-auto py-6 text-center text-xs text-slate-400">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-1">
                            <span>FamilyTrip Finder &copy; 2026 · Guida per famiglie in Italia</span>
                            <span>Fatto con amore per mamme e papà</span>
                        </div>
                    </footer>

                    {/* MOBILE BOTTOM NAV */}
                    <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 px-3 pb-safe" aria-label="Navigazione mobile">
                        <div className="glass-panel rounded-3xl mb-2 grid grid-cols-4 shadow-2xl shadow-black/40">
                            {[
                                { id: "Tutti", label: "Esplora", icon: "compass", action: () => goTo("Tutti"), active: !["I Miei Preferiti", "Info & Guida"].includes(activeTab) },
                                { id: "fav", label: "Preferiti", icon: "heart", action: () => goTo("I Miei Preferiti"), active: activeTab === "I Miei Preferiti", badge: favorites.length },
                                { id: "ai", label: "Live", icon: "radio", action: () => setShowSettingsModal(true), active: showSettingsModal, dot: !!liveData.scannedAt },
                                { id: "guide", label: "Guida", icon: "circle-help", action: () => goTo("Info & Guida"), active: activeTab === "Info & Guida" },
                            ].map(item => (
                                <button
                                    key={item.id}
                                    onClick={item.action}
                                    aria-current={item.active ? 'page' : undefined}
                                    className={`relative flex flex-col items-center justify-center gap-0.5 h-16 text-[11px] font-semibold transition ${item.active ? 'text-coral-400' : 'text-slate-400'}`}
                                >
                                    <span className={`relative grid place-items-center w-10 h-7 rounded-full transition ${item.active ? 'bg-coral-500/15' : ''}`}>
                                        <Icon name={item.icon} className="w-5 h-5" />
                                        {item.badge > 0 && (
                                            <span className="absolute -top-1 -right-0.5 min-w-4 h-4 px-1 grid place-items-center rounded-full bg-coral-500 text-white text-[9px] font-bold">{item.badge}</span>
                                        )}
                                        {item.dot && <span className="absolute top-0 right-1 w-2 h-2 rounded-full bg-mint-400"></span>}
                                    </span>
                                    {item.label}
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }

        // Render Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
